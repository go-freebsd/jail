name: CI

on:
  push:
  pull_request:

jobs:
  portable:
    name: Linux (portable code + cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile for FreeBSD
        run: |
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go vet ./...
          CGO_ENABLED=0 GOOS=freebsd GOARCH=arm64 go vet ./...
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go test -c -o /dev/null .

  freebsd:
    name: FreeBSD ${{ matrix.release }} cgo=${{ matrix.cgo }} (real jails)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["14.3", "15.0"]
        cgo: ["0", "1"]
    steps:
      - uses: actions/checkout@v4
      - name: Test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        with:
          envs: CGO_ENABLED
          release: ${{ matrix.release }}
          usesh: true
          prepare: |
            pkg install -y go
          run: |
            go version
            sysctl kern.osreldate security.jail.jailed security.jail.param.allow.chflags
            go vet ./...
            # Runs as root inside the VM, so the jail lifecycle tests execute for real.
            go test -v -count=1 ./...
